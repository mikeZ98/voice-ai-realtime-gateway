# Scale on live calls, not CPU: a voice pod is saturated by concurrent sessions long
# before its CPU looks busy. Target: 150 calls per pod (tenant cap is 200 per pod).
# The label selector assumes the usual kubernetes-pods scrape job, whose labelmap turns
# pod labels into series labels (app.kubernetes.io/name -> app_kubernetes_io_name).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: voice-gateway
  labels:
    app.kubernetes.io/name: voice-gateway
spec:
  scaleTargetRef:
    name: voice-gateway
  minReplicaCount: 3
  maxReplicaCount: 60
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          # Scale-in drains pods with live calls; go slowly so calls end on their own.
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        query: sum(voice_gateway_active_sessions_count{app_kubernetes_io_name="voice-gateway"})
        threshold: "150"
