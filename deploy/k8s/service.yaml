apiVersion: v1
kind: Service
metadata:
  name: voice-gateway
  labels:
    app.kubernetes.io/name: voice-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: voice-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: kubernetes.io/ws
